[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barkeep"
version = "0.1.0"
description = "Parse TouchBistro SalesByMenuItem CSV exports and load them into Postgres."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
loader = ["psycopg[binary]>=3.2"]
dev = ["pytest>=7", "psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not corpus and not db'"
markers = [
    "corpus: opt-in scan over data/raw (or BARKEEP_CORPUS)",
    "db: opt-in tests that require a running Postgres (DATABASE_URL)",
]
