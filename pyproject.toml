[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barkeep"
version = "0.1.0"
description = "Parse TouchBistro SalesByMenuItem CSV exports into typed Python objects."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not corpus'"
markers = [
    "corpus: opt-in scan over data/raw (or BARKEEP_CORPUS)",
]
