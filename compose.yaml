services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barkeep}
      POSTGRES_USER: ${POSTGRES_USER:-barkeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barkeep}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the Metabase application database on first cluster init.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barkeep} -d ${POSTGRES_DB:-barkeep}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      # Bound to loopback: put a TLS reverse proxy in front in production.
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER:-barkeep}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-barkeep}
      MB_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build: .
    profiles: ["ingest"]
    command: ["python", "-m", "barkeep.loader.migrate"]
    environment: &db_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-barkeep}:${POSTGRES_PASSWORD:-barkeep}@db:5432/${POSTGRES_DB:-barkeep}
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build: .
    profiles: ["ingest"]
    command:
      - sh
      - -c
      - python -m barkeep.loader.migrate && python -m barkeep.ingest.imap
    environment:
      <<: *db_env
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-SalesReports}
      IMAP_SENDER: ${IMAP_SENDER:-}
      IMAP_SUBJECT: ${IMAP_SUBJECT:-}
      IMAP_SINCE_DAYS: ${IMAP_SINCE_DAYS:-21}
      IMAP_PASSWORD_FILE: /run/secrets/imap_password
    secrets:
      - imap_password
    depends_on:
      db:
        condition: service_healthy

  backfill:
    build: .
    profiles: ["ingest"]
    command:
      - sh
      - -c
      - python -m barkeep.loader.migrate && python scripts/backfill.py /data/raw
    environment:
      <<: *db_env
    volumes:
      - ./data/raw:/data/raw:ro
    depends_on:
      db:
        condition: service_healthy

secrets:
  imap_password:
    file: ./secrets/imap_password

volumes:
  pgdata:
