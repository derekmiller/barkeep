services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: barkeep
      POSTGRES_USER: barkeep
      POSTGRES_PASSWORD: barkeep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barkeep -d barkeep"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
