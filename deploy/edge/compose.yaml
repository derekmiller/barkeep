# Example edge stack: Caddy terminating TLS on the LAN and proxying to services
# that join the external `edge` network.
#
# This directory is a worked example, not part of barkeep. Copy it to the host
# (e.g. /opt/edge) and own it there, because it will outlive this project and
# serve every other service you add.
#
#   docker network create edge
#   docker compose -f /opt/edge/compose.yaml up -d
#
# Caddy's local CA lives in the caddy_data volume. After first start, install
# /data/caddy/pki/authorities/local/root.crt on the devices you browse from:
#
#   docker compose -f /opt/edge/compose.yaml \
#     exec caddy cat /data/caddy/pki/authorities/local/root.crt > caddy-root.crt
#
# then add it to the macOS Keychain (and mark it trusted) or to a phone's
# profile. Without that step every browser warns, even though the name resolves.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy_data:
  caddy_config:
